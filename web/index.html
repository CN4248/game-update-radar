  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-radar"></use></svg><span class="brand-pulse"></span></div>
        <div class="brand-copy"><strong>Update Radar</strong><span>GAME WATCHER</span></div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-route="dashboard"><svg class="icon"><use href="#i-dashboard"></use></svg><span>总览</span></button>
        <button class="nav-item" data-route="sources"><svg class="icon"><use href="#i-radar"></use></svg><span>监控源</span><em id="nav-source-count">0</em></button>
        <button class="nav-item" data-route="items"><svg class="icon"><use href="#i-news"></use></svg><span>公告动态</span></button>
        <button class="nav-item" data-route="alerts"><svg class="icon"><use href="#i-bell"></use></svg><span>提醒记录</span></button>
        <div class="nav-sep"><span>配置</span></div>
        <button class="nav-item" data-route="channels"><svg class="icon"><use href="#i-plug"></use></svg><span>通知渠道</span></button>
        <button class="nav-item" data-route="ai"><svg class="icon"><use href="#i-sparkles"></use></svg><span>AI 与网络</span></button>
        <button class="nav-item" data-route="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>主题与设置</span></button>
        <button class="nav-item" data-route="logs"><svg class="icon"><use href="#i-terminal"></use></svg><span>运行日志</span></button>
      </nav>

      <div class="side-status" id="side-status">
        <div class="status-line"><span class="status-dot" id="dot-ai"></span><span>AI 分析</span><b id="txt-ai">检测中</b></div>
        <div class="status-line"><span class="status-dot" id="dot-proxy"></span><span>网络代理</span><b id="txt-proxy">检测中</b></div>
        <div class="status-line"><span class="status-dot" id="dot-scheduler"></span><span>定时调度</span><b id="txt-scheduler">检测中</b></div>
      </div>
      <div class="side-foot"><span class="version">v0.1.0</span><span>自托管 · 数据本地</span></div>
    </aside>

    <div class="sidebar-mask" id="sidebar-mask"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="菜单"><svg class="icon"><use href="#i-menu"></use></svg></button>
          <div><h1 id="page-title">总览</h1><p id="page-sub">正在连接雷达…</p></div>
        </div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <section class="view" id="view">
        <div class="loading-wrap"><span class="spinner"></span><p>正在加载雷达数据…</p></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-root" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <header class="modal-head"><div><h2 id="modal-title"></h2><p id="modal-sub"></p></div><button class="icon-btn" data-action="modal-close" aria-label="关闭"><svg class="icon"><use href="#i-x"></use></svg></button></header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </div>
  </div>

  <div class="toast-root" id="toast-root"></div>
  <script src="/static/app.js?v=1.0.5" defer></script>

</html>
