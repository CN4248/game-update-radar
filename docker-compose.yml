name: game-update-radar

services:
  radar:
    build:
      context: .
      args:
        # 国内网络可改成 https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 国内可换成 Docker Hub 镜像地址，例如 docker.m.daocloud.io/library/python:3.12-slim
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: game-update-radar:1.0.0
    container_name: game-update-radar
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${RADAR_PORT:-3155}:3155"
    environment:
      TZ: Asia/Shanghai
      CONFIG_DIR: /config
      PORT: "3155"
    volumes:
      - ./data:/config
    stop_grace_period: 15s

  # JavaScript rendering sidecar. It shares radar's network namespace, so the
  # app reaches it at 127.0.0.1:3000 and no extra host port is exposed.
  browser:
    # 默认不启动、不拉取；需要 JS 渲染时显式加 --profile browser。
    profiles: ["browser"]
    image: ${BROWSER_IMAGE:-ghcr.io/browserless/chromium:latest}
    pull_policy: missing
    container_name: game-update-radar-browser
    restart: unless-stopped
    network_mode: "service:radar"
    depends_on:
      - radar
    environment:
      TZ: Asia/Shanghai
      CONCURRENT: "2"
      QUEUED: "10"
      TIMEOUT: "60000"
      # 给 Browserless 自身配置出网代理（不是应用页面里的代理）：
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
      # NO_PROXY: localhost,127.0.0.1
    shm_size: "1gb"
